input {
  file {
    path => "/var/log/nginx/netology-access.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-nginx-access"
    add_field => { "[@metadata][dataset]" => "nginx.access" }
  }

  file {
    path => "/var/log/nginx/netology-error.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb-nginx-error"
    add_field => { "[@metadata][dataset]" => "nginx.error" }
  }
}

filter {
  if [@metadata][dataset] == "nginx.access" {
    json {
      source => "message"
    }
    mutate {
      add_field => {
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "nginx.access"
        "[data_stream][namespace]" => "netology44"
        "[event][dataset]" => "nginx.access"
        "[labels][lab]" => "netology44"
        "[labels][ingest_path]" => "logstash-direct"
      }
      remove_field => ["host", "@version"]
    }
  } else if [@metadata][dataset] == "nginx.error" {
    grok {
      match => {
        "message" => "(?<nginx_timestamp>%{YEAR}/%{MONTHNUM}/%{MONTHDAY} %{TIME}) \[%{LOGLEVEL:log_level}\] %{NUMBER:nginx_pid:int}#%{NUMBER:nginx_tid:int}: (?:\*%{NUMBER:nginx_connection_id:int} )?%{GREEDYDATA:nginx_error_message}"
      }
      tag_on_failure => ["_nginx_error_grok_failure"]
    }
    date {
      match => ["nginx_timestamp", "yyyy/MM/dd HH:mm:ss"]
      target => "@timestamp"
      tag_on_failure => ["_nginx_error_date_failure"]
    }
    mutate {
      rename => {
        "log_level" => "[log][level]"
        "nginx_pid" => "[process][pid]"
        "nginx_error_message" => "[error][message]"
      }
      add_field => {
        "[service][name]" => "nginx"
        "[data_stream][type]" => "logs"
        "[data_stream][dataset]" => "nginx.error"
        "[data_stream][namespace]" => "netology44"
        "[event][dataset]" => "nginx.error"
        "[labels][lab]" => "netology44"
        "[labels][ingest_path]" => "logstash-direct"
      }
      remove_field => ["host", "@version", "nginx_timestamp", "nginx_tid"]
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
    data_stream_auto_routing => "true"
    ecs_compatibility => "v8"
  }
}
