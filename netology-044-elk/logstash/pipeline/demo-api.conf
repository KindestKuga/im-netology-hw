input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    tag_on_failure => ["_demoapi_json_failure"]
  }

  mutate {
    add_field => {
      "[data_stream][type]" => "logs"
      "[data_stream][dataset]" => "demoapi.application"
      "[data_stream][namespace]" => "netology44"
      "[event][dataset]" => "demoapi.application"
      "[labels][lab]" => "netology44"
      "[labels][ingest_path]" => "filebeat-logstash"
    }
    remove_field => ["@version", "lab_dataset"]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    data_stream => "true"
    data_stream_auto_routing => "true"
    ecs_compatibility => "v8"
  }
}
