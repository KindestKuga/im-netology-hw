worker_processes auto;
error_log /var/log/nginx/netology-error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format elk escape=json
      '{'
        '"@timestamp":"$time_iso8601",'
        '"trace":{"id":"$request_id"},'
        '"service":{"name":"nginx"},'
        '"source":{"ip":"$remote_addr"},'
        '"http":{'
          '"request":{"method":"$request_method"},'
          '"response":{"status_code":$status,"body":{"bytes":$body_bytes_sent}}'
        '},'
        '"url":{"path":"$uri","original":"$request_uri"},'
        '"user_agent":{"original":"$http_user_agent"},'
        '"nginx":{"request_time":$request_time,"upstream_response_time":"$upstream_response_time"},'
        '"message":"$request_method $request_uri -> $status"'
      '}';

    access_log /var/log/nginx/netology-access.log elk;

    upstream demo_api {
        server demo-api:8080;
        keepalive 8;
    }

    server {
        listen 80;
        server_name _;

        location = / {
            default_type text/plain;
            return 200 "netology44 elk lab\n";
        }

        location = /api/ok {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_pass http://demo_api/ok;
        }

        location = /api/error {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_pass http://demo_api/error;
        }

        location = /api/slow {
            proxy_set_header X-Request-ID $request_id;
            proxy_set_header Host $host;
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_pass http://demo_api/slow;
        }

        location = /missing {
            default_type text/plain;
            return 404 "not found\n";
        }

        location = /broken-upstream {
            proxy_connect_timeout 1s;
            proxy_read_timeout 1s;
            proxy_pass http://127.0.0.1:65534;
        }
    }
}
