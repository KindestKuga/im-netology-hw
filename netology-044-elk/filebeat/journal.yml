filebeat.inputs:
  - type: journald
    id: system-lab-journal
    paths:
      - /var/log/journal
    include_matches.match:
      - SYSLOG_IDENTIFIER=system-lab
    index: logs-system.journal-netology44
    fields_under_root: true
    fields:
      data_stream:
        type: logs
        dataset: system.journal
        namespace: netology44
      event:
        dataset: system.journal
      labels:
        lab: netology44
        ingest_path: filebeat-journald
        synthetic: true
      service:
        name: system-lab

setup.template.enabled: false
setup.ilm.enabled: false

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  preset: latency

logging.level: info
