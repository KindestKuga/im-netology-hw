name: netology-048-sql-part-2

services:
  mysql:
    image: mysql:8.4.13@sha256:a0225d1ea6631c8bc2385dc4c2faba17bbf1834ecf369e1659a9a382bd8d5dd7
    restart: "no"
    cpus: 1
    mem_limit: 1g
    pids_limit: 256
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create local .env}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - lab_net
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$${MYSQL_ROOT_PASSWORD}\" mysql --protocol=TCP --host=127.0.0.1 --user=root --batch --skip-column-names --execute='SELECT 1'"]
      interval: 3s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  mysql_data:

networks:
  lab_net:
    internal: true
