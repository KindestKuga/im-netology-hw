global
  maxconn 1000

defaults
  default-server init-addr none
  mode http
  timeout connect 5000ms
  timeout client 50000ms
  timeout server 50000ms

resolvers docker
  nameserver dns 127.0.0.11:53
  hold valid 10s

frontend http_front
  bind *:8080
  mode http
  default_backend http_back

backend http_back
  balance roundrobin
  mode http
  server web web:5000 check resolvers docker init-addr libc,none
